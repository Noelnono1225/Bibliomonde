
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17365D">
  <title>BiblioMonde</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f2f5f9;
      color: #172b4d;
    }
    header {
      background: #17365D;
      color: white;
      text-align: center;
      padding: 22px 12px;
    }
    main {
      max-width: 650px;
      margin: 20px auto;
      padding: 16px;
    }
    section {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #00000012;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 9px;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #bbc5d3; }
    button {
      background: #17365D;
      color: white;
      border: none;
      cursor: pointer;
    }
    .book {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
      overflow-wrap: anywhere;
    }
    .small { font-size: 13px; color: #65758b; }
  </style>
</head>
<body>
  <header>
    <h1>📚 BiblioMonde</h1>
    <p>Votre bibliothèque, partout dans le monde</p>
  </header>

  <main>
    <section>
      <h2>Ajouter un livre</h2>
      <form id="bookForm">
        <input id="titre" placeholder="Titre du livre" required>
        <input id="auteur" placeholder="Nom de l'auteur" required>
        <input id="categorie" placeholder="Catégorie du livre">
        <button type="submit">Ajouter le livre</button>
      </form>
    </section>

    <section>
      <h2>Rechercher un livre</h2>
      <input id="recherche" placeholder="Titre ou auteur...">
      <p id="compteur" class="small">0 livre</p>
      <div id="liste"></div>
    </section>

    <p class="small">
      Version initiale de BiblioMonde. Les livres enregistrés
      sont conservés sur cet appareil et ce navigateur.
    </p>
  </main>

  <script>
    const cle = "bibliomonde_livres_v1";
    let livres = [];
    try {
      livres = JSON.parse(localStorage.getItem(cle) || "[]");
      if (!Array.isArray(livres)) livres = [];
    } catch (e) {
      livres = [];
    }

    const form = document.getElementById("bookForm");
    const liste = document.getElementById("liste");
    const recherche = document.getElementById("recherche");
    const compteur = document.getElementById("compteur");

    function afficher() {
      const mot = recherche.value.trim().toLowerCase();
      const filtres = livres.filter(l =>
        (l.titre + " " + l.auteur + " " + l.categorie)
          .toLowerCase().includes(mot)
      );
      liste.replaceChildren();
      compteur.textContent = filtres.length + " livre(s) affiché(s)";
      filtres.forEach(l => {
        const div = document.createElement("div");
        div.className = "book";
        const titre = document.createElement("strong");
        titre.textContent = l.titre;
        const details = document.createElement("p");
        details.textContent = "Auteur : " + l.auteur +
          (l.categorie ? " — Catégorie : " + l.categorie : "");
        const supprimer = document.createElement("button");
        supprimer.type = "button";
        supprimer.textContent = "Supprimer";
        supprimer.onclick = () => {
          livres = livres.filter(x => x.id !== l.id);
          sauvegarder();
        };
        div.append(titre, details, supprimer);
        liste.append(div);
      });
    }

    function sauvegarder() {
      try {
        localStorage.setItem(cle, JSON.stringify(livres));
        afficher();
      } catch (e) {
        alert("Enregistrement impossible sur cet appareil.");
      }
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      livres.push({
        id: Date.now().toString(),
        titre: document.getElementById("titre").value.trim(),
        auteur: document.getElementById("auteur").value.trim(),
        categorie: document.getElementById("categorie").value.trim()
      });
      sauvegarder();
      form.reset();
    });

    recherche.addEventListener("input", afficher);
    afficher();
  </script>
</body>
</html>
